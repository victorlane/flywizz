name: Live functional tests

# Wizz Air's API has no contract and no changelog. `api-health.yml` probes the
# raw response shapes; this runs the SDK's own functional suite against the
# live API, so drift is caught the way a user would feel it -- through
# `WizzAir` and `AsyncWizzAir`, including the derived helpers.
#
# Upstream outages and edge blocks skip rather than fail, so a red run here
# means the SDK and the API actually disagree.

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "flywizz/**"
      - "tests/functional/**"

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp,dev]"

      - name: Run the live functional suite
        env:
          FLYWIZZ_LIVE: "1"
        run: pytest tests/functional -v -rs
